# Builds the RunPod image (Dockerfile) and pushes it to ghcr.io/<owner>/mcts-runpod, tagged
# `latest` and with the commit hash. Runs when the code changes on main, or by hand:
#   gh workflow run docker.yml
name: Docker image (RunPod)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - src/**
      - examples/**
      - .github/workflows/docker.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mcts-runpod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The CUDA images and libtorch need about 30 GB; the runner starts with about 14 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          docker system prune -af
          df -h /

      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push --all-tags "$IMAGE"
