[package]
name = "mcts"
version = "0.1.0"
edition = "2024"
description = "Generic N-player MCTS, AlphaZero, and Minimax engine in Rust"
license = "MIT"

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
crossbeam-queue = "0.3.14"
crossbeam-utils = "0.8.23"
rand = "0.10.3"
rand_distr = "0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# libtorch backend (feature `tch`). tch 0.22 expects libtorch 2.9 (pinned in start_lab.sh).
# Build with LIBTORCH=/path/to/libtorch; `start_lab.sh --tch` downloads it to ./libtorch.
tch = { version = "0.22", optional = true }
# Direct dependency only so build.rs receives libtorch's lib dir (`links` metadata) for the rpath.
torch-sys = { version = "0.22", optional = true }

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
# cuDNN convolutions for candle on CUDA (needs the cuDNN libraries, e.g. an nvidia/cuda *-cudnn image).
cudnn = ["cuda", "candle-core/cudnn", "candle-nn/cudnn"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
# libtorch backend via tch-rs (selectable at runtime next to candle).
tch = ["dep:tch", "dep:torch-sys"]
