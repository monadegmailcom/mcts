[package]
name = "mcts"
version = "0.1.0"
edition = "2024"
description = "Generic N-player MCTS, AlphaZero, and Minimax engine in Rust"
license = "MIT"

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
crossbeam-queue = "0.3.14"
crossbeam-utils = "0.8.23"
rand = "0.10.3"
rand_distr = "0.6.0"

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
